[pytest]
markers =
    live: hits real network endpoints / a real browser / Ollama — run with -m live

# Live tests are EXCLUDED by default. They were always documented as opt-in ("run with -m live"),
# but nothing enforced it, so every run paid for them: one of them (the full-pipeline test) alone
# took 82s of a 173s suite, and the rest add real Chromium launches and Ollama calls. Excluding
# them cuts the default loop to ~a minute of genuinely deterministic tests, which is what you want
# to run constantly. Run the live ones deliberately before a release:
#
#     pytest -m live          # just the live ones
#     pytest -m ""            # everything, live included
addopts = -m "not live"
